defaults:
  - sim: default
  - mpc: kart
  - robots: kart
  - tokenize: path
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

family: kart
n_blocks: 1  # number of batches; each batch writes one shard
first_block: 0  # index of the first batch; shard ids and seeds follow the batch index
envs_per_batch: 4096
xi_per_block: 16  # condition draws per (robot, scene, theta) block
seed: 0
out_dir: data/rollouts/kart
device: cpu
deterministic: false  # torch.use_deterministic_algorithms(True) and CUBLAS_WORKSPACE_CONFIG
task_mix:  # relative share of blocks per task within each batch
  lap: 0.5
  goto: 0.5

bench:
  B: 4096
  steps: 100
  warmup_steps: 3  # untimed control steps first (torch.compile happens here)
  control_rate_hz: 20.0
  solver_iters: 10
  perception_rate_hz: 10.0

hydra:
  output_subdir: null
  run:
    dir: .
