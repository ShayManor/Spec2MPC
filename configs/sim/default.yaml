ds_m: 0.25
scene:
  spline_fine_ds_m: 0.05
  min_turn_radius_floor_m: 3.0
  max_attempts: 500
  n_laps: 2
  lap:
    n_ctrl: [8, 14]
    length_m: [80.0, 250.0]
    half_width_m: [2.5, 5.0]
    radial_jitter: 0.4
    angle_jitter_frac: 0.3
    overlap_arc_hw_factor: 4.0
    overlap_dist_hw_factor: 2.0
    overlap_extra_m: 1.0
    overlap_stride_m: 1.0
    goal_tol_m: 0.0
  goto:
    n_ctrl: [4, 7]
    length_m: [30.0, 120.0]
    half_width_m: [3.0, 8.0]
    turn_max_rad: 0.8
    n_obstacles: [0, 6]
    obstacle_r_m: [0.3, 1.0]
    n_peds: [0, 6]
    ped_r_m: 0.3
    ped_speed_mps: [0.5, 1.5]
    start_clear_m: 5.0
    goal_clear_m: 3.0
    # planner routes the path around static obstacles: max kart radius 0.5*hypot(1.3, 2.1) = 1.235 m
    # (configs/robots/kart.yaml ranges) + nominal c_margin 0.3 m (configs/mpc/kart.yaml)
    path_clear_m: 1.54
    placement_attempts: 50
    goal_tol_m: 1.0
    n_laps: 1
grid:
  size_m: 20.0
  res_m: 0.2
  frame_offsets_s: [0.0, 0.5, 1.0, 1.5]
  edt_chunk_bytes: 2.0e9
plant_dt_s: 0.01
store_hz: 10.0
max_consecutive_solver_failures: 3
spin_vy_max_mps: 4.0
spin_omega_max_radps: 5.0
conditions:
  friction_scale: [0.6, 1.1]
  mass_scale: [0.9, 1.15]
  latency_s: [0.0, 0.06]
  init_lateral_m: [-0.5, 0.5]
  init_heading_rad: [-0.15, 0.15]
  init_speed_mps: [0.0, 2.0]
episode:
  timeout_v_frac: 0.15
  timeout_cap_lap_s: 300.0
  timeout_cap_goto_s: 120.0
  progress_window_m: 5.0
  done_check_every: 20
