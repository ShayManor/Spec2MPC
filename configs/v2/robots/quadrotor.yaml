# safety floors: clipped by the program adapter, never changed by model output
family: quadrotor
solver: sampling
floors:
  min_clearance_m: 0.3
  max_speed_frac: 0.8
  max_force_frac: 0.9
  max_tilt_rad: 0.6
# ranges: params and perception are uniform [lo, hi]; runtime lists are discrete choices.
# seed None gives the nominal robot: range midpoints and the first runtime choice.
# members: mjcf is menagerie:<path> (MENAGERIE_PATH or configs/v2/menagerie.lock) or generated:<file>
# (spec2mpc/robots/v2/models); frames map canonical frame names to body:, site:, or geom: names.
ranges:
  params:
    mass_scale: [0.9, 1.1]
    friction_scale: [0.8, 1.2]
    damping_scale: [0.8, 1.2]
  perception:
    range_m: [5, 20]
    fov_rad: [1.5, 3.0]
    loc_noise_std_m: [0.0, 0.05]
    loc_bias_m: [0.0, 0.02]
    latency_s: [0.0, 0.05]
    p_miss: [0.0, 0.05]
    rate_hz: [20, 60]
  runtime:
    control_rate_hz: [100, 50, 200]
    horizon_s: [1.0, 0.5, 2.0]
    n_samples: [64, 32, 128, 256]
members:
  - name: skydio_x2
    mjcf: menagerie:skydio_x2/x2.xml
    frames: {base: body:x2}
  - name: crazyflie2
    mjcf: menagerie:bitcraze_crazyflie_2/cf2.xml
    frames: {base: body:cf2}
