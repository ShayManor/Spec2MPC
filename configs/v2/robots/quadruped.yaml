# safety floors: clipped by the program adapter, never changed by model output
family: quadruped
solver: sampling
floors:
  min_clearance_m: 0.1
  max_speed_frac: 0.8
  max_force_frac: 0.8
# ranges: params and perception are uniform [lo, hi]; runtime lists are discrete choices.
# seed None gives the nominal robot: range midpoints and the first runtime choice.
# members: mjcf is menagerie:<path> (MENAGERIE_PATH or configs/v2/menagerie.lock) or generated:<file>
# (spec2mpc/robots/v2/models); frames map canonical frame names to body:, site:, or geom: names.
ranges:
  params:
    mass_scale: [0.8, 1.2]
    friction_scale: [0.6, 1.4]
    damping_scale: [0.7, 1.3]
  perception:
    range_m: [5, 20]
    fov_rad: [1.5, 6.2832]
    loc_noise_std_m: [0.0, 0.05]
    loc_bias_m: [0.0, 0.03]
    latency_s: [0.0, 0.1]
    p_miss: [0.0, 0.05]
    rate_hz: [10, 30]
  runtime:
    control_rate_hz: [50, 25, 100]
    horizon_s: [0.5, 0.3, 1.0]
    n_samples: [128, 64, 256, 512]
members:
  - name: go2
    mjcf: menagerie:unitree_go2/go2.xml
    frames: {base: body:base, foot_fl: geom:FL, foot_fr: geom:FR, foot_rl: geom:RL, foot_rr: geom:RR}
  - name: spot
    mjcf: menagerie:boston_dynamics_spot/spot.xml
    frames: {base: body:body, foot_fl: geom:FL, foot_fr: geom:FR, foot_rl: geom:HL, foot_rr: geom:HR}
  - name: anymal_c
    mjcf: menagerie:anybotics_anymal_c/anymal_c.xml
    frames: {base: body:base, foot_fl: body:LF_SHANK, foot_fr: body:RF_SHANK, foot_rl: body:LH_SHANK, foot_rr: body:RH_SHANK}
