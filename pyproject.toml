[project]
name = "spec2mpc"
version = "0.1.0"
description = "Language-conditioned synthesis of MPC parameters"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "hydra-core",
    "omegaconf",
    "pyyaml",
    "pyarrow",
    "zarr",
    "numpy",
    "sentence-transformers>=6.2.0",
]

[project.optional-dependencies]
llm = [
    "openai>=3.42.0",
]
v2 = [
    "flask>=3.1.3",
    "jax>=0.6.2",
    "jsonschema>=4.26.0",
    "mujoco>=3.17.0",
    "mujoco-mjx>=3.17.0",
    "openai>=3.42.0",
    "pillow>=12.3.0",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = ["pytest", "scipy", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec2mpc"]

[tool.pytest.ini_options]
markers = ["slow: GPU/long"]
addopts = "-m 'not slow'"
