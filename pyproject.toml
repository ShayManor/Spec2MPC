[project]
name = "spec2mpc"
version = "0.1.0"
description = "Language-conditioned synthesis of MPC parameters"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "hydra-core",
    "omegaconf",
    "pyyaml",
    "pyarrow",
    "zarr",
    "numpy",
]

[dependency-groups]
dev = ["pytest", "scipy", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec2mpc"]

[tool.pytest.ini_options]
markers = ["slow: GPU/long"]
addopts = "-m 'not slow'"
