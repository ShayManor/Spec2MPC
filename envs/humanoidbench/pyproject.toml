# Separate env for HumanoidBench (pins mujoco 3.1.6, torch 2.3.1); evaluation only.
# Setup: ./setup.sh (clones HumanoidBench at the pinned commit, runs uv sync).
# The repo installs editable from the clone: its wheel drops dmc_deps and the assets.
[project]
name = "spec2mpc-env-humanoidbench"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "humanoid-bench",
    "torch==2.3.1",
]

[tool.uv]
package = false

[tool.uv.sources]
humanoid-bench = { path = "humanoid-bench", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
